<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel — Ferchuu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
<main class="admin-wrap">
  <div class="admin-top"><a class="logo" href="index.html">Fer<span>chuu</span></a><a class="text-link" href="blog.html">Ver blog ↗</a></div>

  <section id="login-panel" class="admin-card">
    <p class="eyebrow">PANEL PRIVADO</p>
    <h1>Entrar</h1>
    <p class="muted">Usá el email y contraseña de tu usuario de Supabase.</p>
    <form id="login-form">
      <label>Email<input id="email" type="email" autocomplete="email" required></label>
      <label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary full" type="submit">Entrar</button>
      <p id="login-message" class="message"></p>
    </form>
  </section>

  <section id="dashboard" class="dashboard hidden">
    <div class="dashboard-head">
      <div><p class="eyebrow">PANEL DE FERCHUU</p><h1 id="form-title">Nueva publicación</h1></div>
      <button id="logout" class="btn secondary">Cerrar sesión</button>
    </div>

    <form id="post-form" class="admin-card">
      <input id="post-id" type="hidden">
      <label>Título<input id="title" maxlength="120" required placeholder="Mi nuevo post"></label>
      <label>Resumen<input id="excerpt" maxlength="220" placeholder="Una breve descripción"></label>
      <label>Imagen destacada<input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label>
      <div id="image-preview" class="image-preview hidden"></div>
      <label>Contenido<textarea id="content" rows="14" required placeholder="Escribí tu publicación..."></textarea></label>
      <div class="form-actions"><button class="btn primary" type="submit">Publicar</button><button id="cancel-edit" class="btn secondary hidden" type="button">Cancelar edición</button></div>
      <p id="form-message" class="message"></p>
    </form>

    <section>
      <div class="section-heading"><div><p class="eyebrow">PUBLICACIONES</p><h2>Mis posts</h2></div></div>
      <div id="admin-posts" class="admin-posts"></div>
    </section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
